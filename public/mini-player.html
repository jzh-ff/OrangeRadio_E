<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrangeSea Mini Player</title>
  <meta name="referrer" content="no-referrer">
  <style>
    :root {
      --accent: #ff7a3d;
      --accent-deep: #9a6f2c;
      --ink: #F5F0E6;
      --bg: rgba(20, 14, 8, .92);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Noto Sans SC", "Inter", -apple-system, sans-serif;
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 12px;
      background: var(--bg);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border-radius: 16px;
      border: 1px solid rgba(255, 122, 61, .22);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .5);
    }

    /* 封面 */
    .mp-cover {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      background-size: cover;
      background-position: center;
      background-color: #1a120a;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
    }
    .mp-cover.empty {
      background-image: radial-gradient(circle at 50% 40%, rgba(255, 122, 61, .2), transparent 65%);
    }

    /* 中间：信息 + 进度 */
    .mp-center {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .mp-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink);
    }
    .mp-artist {
      font-size: 11px;
      color: rgba(245, 240, 230, .55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mp-progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }
    .mp-progress {
      flex: 1;
      height: 3px;
      border-radius: 999px;
      background: rgba(245, 240, 230, .16);
      cursor: pointer;
      position: relative;
    }
    .mp-progress-fill {
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent));
      pointer-events: none;
    }
    .mp-time {
      font-size: 10px;
      color: rgba(245, 240, 230, .5);
      font-variant-numeric: tabular-nums;
      font-family: "JetBrains Mono", monospace;
      min-width: 64px;
      text-align: right;
    }

    /* 控制按钮 */
    .mp-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .mp-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: rgba(245, 240, 230, .8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .15s, background .15s, transform .1s;
    }
    .mp-btn:hover { color: var(--accent); background: rgba(255, 122, 61, .12); }
    .mp-btn:active { transform: scale(.88); }
    .mp-btn.mp-play {
      width: 36px;
      height: 36px;
      background: linear-gradient(145deg, var(--accent), var(--accent-deep));
      color: #1a120a;
      box-shadow: 0 4px 14px rgba(255, 122, 61, .4);
    }
    .mp-btn.mp-play:hover {
      color: #1a120a;
      background: linear-gradient(145deg, #ff9c6e, #b8842c);
    }
    .mp-btn svg { width: 16px; height: 16px; }
    .mp-btn.mp-play svg { width: 18px; height: 18px; }

    /* 关闭按钮 */
    .mp-close {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: rgba(245, 240, 230, .1);
      color: rgba(245, 240, 230, .5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      opacity: 0;
      transition: opacity .2s, color .2s;
    }
    body:hover .mp-close { opacity: 1; }
    .mp-close:hover { color: var(--accent); }

    .mp-drag {
      -webkit-app-region: drag;
      position: absolute;
      inset: 0;
      z-index: -1;
    }
    .mp-btn, .mp-progress, .mp-close { -webkit-app-region: no-drag; }
  </style>
</head>

<body>
  <div class="mp-drag"></div>
  <button class="mp-close" title="关闭迷你播放器" aria-label="关闭">×</button>
  <div class="mp-cover empty" id="mp-cover"></div>
  <div class="mp-center">
    <div class="mp-title" id="mp-title">OrangeSea</div>
    <div class="mp-artist" id="mp-artist">橘子海</div>
    <div class="mp-progress-row">
      <div class="mp-progress" id="mp-progress">
        <div class="mp-progress-fill" id="mp-progress-fill"></div>
      </div>
      <div class="mp-time" id="mp-time">0:00 / 0:00</div>
    </div>
  </div>
  <div class="mp-controls">
    <button class="mp-btn" id="mp-prev" title="上一首" aria-label="上一首">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="mp-btn mp-play" id="mp-play" title="播放/暂停" aria-label="播放/暂停">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="mp-btn" id="mp-next" title="下一首" aria-label="下一首">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>

  <script>
    (function () {
      var state = {
        title: '', artist: '', cover: '',
        playing: false, progress: 0, currentTime: 0, duration: 0
      };

      function $(id) { return document.getElementById(id); }

      function formatTime(sec) {
        sec = Math.max(0, Math.floor(sec || 0));
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        return m + ':' + (s < 10 ? '0' + s : s);
      }

      function applyState(next) {
        state = Object.assign(state, next || {});
        if (state.title) { $('mp-title').textContent = state.title; }
        if (state.artist !== undefined) { $('mp-artist').textContent = state.artist || ''; }
        if (state.cover !== undefined) {
          var cover = $('mp-cover');
          if (state.cover) {
            cover.style.backgroundImage = 'url("' + state.cover.replace(/"/g, '\\"') + '")';
            cover.classList.remove('empty');
          } else {
            cover.style.backgroundImage = '';
            cover.classList.add('empty');
          }
        }
        var pct = state.duration > 0 ? Math.min(100, (state.currentTime / state.duration) * 100) : 0;
        $('mp-progress-fill').style.width = pct + '%';
        $('mp-time').textContent = formatTime(state.currentTime) + ' / ' + formatTime(state.duration);
        // 播放按钮图标
        var playBtn = $('mp-play');
        playBtn.innerHTML = state.playing
          ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      }

      // 接收主窗口推送的状态
      if (window.desktopOverlay && typeof window.desktopOverlay.onMiniPlayerState === 'function') {
        window.desktopOverlay.onMiniPlayerState(applyState);
      }

      // 按钮动作（通过 IPC 转发到主窗口，复用快捷键 action）
      function send(action) {
        if (window.desktopOverlay && typeof window.desktopOverlay.sendMiniPlayerAction === 'function') {
          window.desktopOverlay.sendMiniPlayerAction(action);
        }
      }
      $('mp-prev').addEventListener('click', function () { send('prevTrack'); });
      $('mp-play').addEventListener('click', function () { send('togglePlay'); });
      $('mp-next').addEventListener('click', function () { send('nextTrack'); });

      // 进度条 seek
      $('mp-progress').addEventListener('click', function (e) {
        if (!state.duration) return;
        var rect = this.getBoundingClientRect();
        var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        // 通过 action 不够精细，直接传 seek 数据（主进程暂不处理 seek，这里用进度点击切换上一首/下一首的近似）
        // 注：精确 seek 需要额外 IPC，当前版本迷你条只支持播放控制，进度条为只读显示
      });

      // 关闭按钮
      $('mp-close').addEventListener('click', function () {
        if (window.desktopOverlay && typeof window.desktopOverlay.closeMiniPlayer === 'function') {
          window.desktopOverlay.closeMiniPlayer();
        }
      });
    })();
  </script>
</body>

</html>
